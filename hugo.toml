baseURL = "https://mengattorney.me/"
languageCode = "zh-cn"
title = "孟庆一律师"
theme = "devise"
relativeURLs = true
enableEmoji = true
googleAnalytics = ""
enableRobotsTXT = true
copyright = "&copy; 2026, CC"

# 主菜单
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    title = "文章"
    url = "/posts/"
    weight = -100
  [[menu.main]]
    identifier = "categories"
    name = "分类"
    title = "分类"
    url = "/categories/"
    weight = -90
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    title = "标签"
    url = "/tags/"
    weight = -80

# 配置参数
[params]
  description = "刑事律师"
  header_title = "孟庆一律师"
  header_subtitle = "专注刑事辩护"
  home_image = "/covers/site-cover.jpg"
  recent_posts = 5
  mainSections = ["posts", "post"]

  [params.style]
    backgroundColor = "#f8f9fa"
    homeImageBorderColor = "#ffffff"
    fontFamilyBase = "Helvetica Neue"
    fontColor = "#212529"

[taxonomies]
  tag = 'tags'
  category = 'categories'
  